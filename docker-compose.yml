services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chamados}
      POSTGRES_USER: ${DB_USERNAME:-chamados}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados}
    volumes:
      - chamados-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-chamados}
      DB_USERNAME: ${DB_USERNAME:-chamados}
      DB_PASSWORD: ${DB_PASSWORD:-chamados}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chamados-data:
