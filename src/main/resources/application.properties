spring.application.name=chamados-api

# Banco de dados: valores vindos de variaveis de ambiente (sem senha fixa aqui)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamados}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O esquema e responsabilidade do Flyway; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Paginacao: 10 itens por padrao, no maximo 50
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
